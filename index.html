<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>同事小學堂｜一起工作，從認識開始</title><style>

px solid #cbded0;border-radius:28px;padding:36px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center}.hero p{margin-top:16px;max-width:560px}.hero .primary{margin-top:24px}.portraits{display:flex;justify-content:center;align-items:end}.portraits svg{width:44%;max-width:180px;margin:0 -15px;transform:rotate(-7deg)}.portraits svg:nth-child(2){transform:rotate(8deg) translateY(-18px)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:24px}.card{border:1px solid var(--line);border-radius:23px;padding:24px;background:#fffdf8;min-width:0}.activity{display:flex;flex-direction:column;gap:10px}.activity button{margin-top:auto;text-align:left}.icon{width:49px;height:49px;display:grid;place-items:center;border-radius:17px;font-size:25px;background:var(--peach)}.activity:nth-child(2) .icon{background:var(--mint)}.activity:nth-child(3) .icon{background:#ece5f0}.me{margin-top:24px;display:flex;align-items:center;gap:20px}.me svg{width:90px;flex-shrink:0}.me .details{flex:1}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:10px 0 22px}.quiz{display:grid;grid-template-columns:300px 1fr;gap:28px}.person{text-align:center;background:#e8eee2;border-radius:24px;padding:26px}.person svg{width:100%;max-width:220px;display:block;margin:0 auto 12px}.person h2{margin:8px 0}.options{display:grid;gap:12px;margin-top:24px}.option{text-align:left;display:flex;gap:12px;align-items:center;min-height:58px}.letter{font-size:13px;display:grid;place-items:center;border-radius:8px;min-width:28px;height:28px;background:#f0eee5}.option.correct{border:2px solid #49765a;background:#e6f2e6}.option.wrong{border:2px solid #ad6846;background:#fce9db}.feedback{margin-top:20px;padding:20px;background:#eef3e8;border-radius:16px}.feedback p{margin:8px 0 16px}.progress{width:150px;height:7px;background:#e4e8db;border-radius:20px;overflow:hidden;margin-top:8px}.progress span{display:block;background:#61866b;height:100%}.score{text-align:right;font-size:14px}.search{display:flex;align-items:center;gap:12px;background:white;border:1px solid #bdcdbf;border-radius:16px;padding:8px 16px;margin:20px 0 10px}.search input{width:100%;min-width:0;border:0;background:transparent;padding:10px 0;color:var(--ink)}.directory{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:18px}.profilehead{display:flex;gap:16px;align-items:center;margin-bottom:15px}.profilehead svg{width:83px;flex-shrink:0}.profilehead p{color:var(--muted)}dl{margin:12px 0 0}dt{font-size:12px;color:var(--muted);margin-top:12px;font-weight:750}dd{margin:3px 0 0}summary{cursor:pointer;font-weight:650;padding-top:12px;border-top:1px solid var(--line)}.empty{text-align:center;padding:55px 20px;grid-column:1/-1}.login{max-width:880px;margin:40px auto}.login .hero{grid-template-columns:1fr 190px}.loginform{max-width:570px;margin:24px auto}.loginform input{width:100%;border:1px solid #afc2b2;border-radius:12px;padding:13px;margin:8px 0 12px;background:white}.loginform .primary{width:100%}.demoaccounts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.demoaccounts button{font-size:13px;text-align:left;padding:10px}.error{color:#9a442e;min-height:24px;font-size:14px}.footer{border-top:1px solid var(--line);margin-top:32px;padding:22px 0;font-size:12px;color:var(--muted);display:flex;gap:16px;justify-content:space-between}.result{text-align:center;max-width:600px;margin:32px auto;padding:44px 24px;background:var(--mint);border-radius:28px}.result h1{margin:18px}.result p{margin-bottom:24px}.result button{margin:5px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}@media(max-width:700px){.wrap{padding:16px}.top{align-items:flex-start}.brand{font-size:18px}.top button{font-size:12px;padding:9px}.hero{grid-template-columns:1fr;padding:26px}.hero .portraits{display:none}.grid{grid-template-columns:1fr}.activity{padding:20px}.quiz{grid-template-columns:1fr;gap:20px}.person{display:flex;align-items:center;text-align:left;gap:18px;padding:18px}.person svg{width:100px;margin:0}.sectionhead{align-items:flex-start}.sectionhead h2{font-size:23px}.score{flex-shrink:0}.progress{width:95px}.directory{grid-template-columns:1fr}.login{margin-top:24px}.login .hero{grid-template-columns:1fr}.login .hero>svg{display:none}.me{flex-wrap:wrap;padding:18px;gap:14px}.me .details{min-width:160px}.footer{flex-direction:column;gap:5px}.nav{gap:3px;margin:20px 0}.nav button{padding:10px;font-size:14px}.demoaccounts{grid-template-columns:1fr}.notice{font-size:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transform:none!important}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><span class="brandmark" aria-hidden="true">✳</span><div>同事小學堂 <span class="tag">試玩版</span></div></div><button id="logout" hidden>登出／切換帳號</button></header><div class="notice"><strong>示範登入，非正式公司驗證。</strong>帳號皆為虛構示範 ID，使用公開示範密碼、可自由切換；請勿輸入真實帳密。資料僅存於本機瀏覽器，不會傳送。<span id="storageNotice" class="storage"></span></div><nav id="nav" class="nav" aria-label="主要選單" hidden></nav><main id="main"></main><footer class="footer"><span>一起工作，從認識彼此開始。<br>插畫為風格化示意，並非本人肖像。</span><span>MBTI 僅供個人資料展示，不推論個性<br>遊戲分數不儲存、不排名，也不用於員工評核。</span></footer></div><noscript>請啟用 JavaScript 才能使用登入、遊戲與同事搜尋。</noscript><script>
'use strict';
const people=[
{id:'DEMO01',name:'張靖欣',role:'牙科培訓',mbti:'INTP',hair:'long',color:'#d5a278',duties:'牙科健保知識了解／診所同意書製作／值班客服',expert:'教學',pref:'講重點',fiction:false},
{id:'DEMO02',name:'黃小琪',role:'醫美培訓',mbti:'INFP',hair:'short',color:'#cb9282',duties:'自費診所系教學培訓顧問',expert:'',pref:'討論事情以實務面說明',fiction:false},
{id:'DEMO03',name:'蘇詠哲',role:'人資專員',mbti:'ENTJ',hair:'short',color:'#9baabd',duties:'招募、請假／加班處理、勞資問題處理、新人教育訓練',expert:'',pref:'直接說明需求，理性討論、保持禮貌',fiction:false},
{id:'DEMO04',name:'陳柏宇',role:'硬體工程師',mbti:'ISTP',hair:'short',color:'#354c68',duties:'到診所安裝電腦、接線與安裝後測試',expert:'硬體問題排查',pref:'事先提供設備數量、現場照片與可施工時間',fiction:true,prop:'tools'},
{id:'DEMO05',name:'林語安',role:'軟體工程師',mbti:'INTJ',hair:'medium',color:'#719782',duties:'處理軟體系統 Bug、追查修正測試',expert:'',pref:'提供操作步驟、錯誤訊息與發生時間，截圖先遮蔽病患個資',fiction:true,prop:'laptop'}];
const $=s=>document.querySelector(s), main=$('#main'),KEY='company-classroom-demo-v1';let me=null,view='home',round=null,lastPerson=null,lastMission=null,storageOK=true;
function storage(action,value){try{if(action==='read')return localStorage.getItem(KEY);if(action==='write')localStorage.setItem(KEY,value);if(action==='remove')localStorage.removeItem(KEY);}catch(e){storageOK=false;$('#storageNotice').textContent=' 此瀏覽器無法使用本機儲存；本次仍可試玩，重新開啟後可能需要再選帳號。';}return null;}
function avatar(p){const long=p.hair!=='short';return '<svg viewBox="0 0 180 190" role="img" aria-label="'+p.name+'的風格化人物插畫"><rect x="3" y="3" width="174" height="184" rx="38" fill="#f7eddb"/><circle cx="143" cy="34" r="12" fill="#dce8cc"/><path d="M23 146 Q10 116 29 102 Q41 125 23 146" fill="#a9bf9c"/><path d="M27 168L25 129" stroke="#748d6a" stroke-width="3"/><path d="M'+(long?'48 99V64Q47 23 89 23Q134 22 135 65V':'53 88V57Q56 23 91 25Q133 24 128 70V')+(p.hair==='long'?'140':'110')+'H48Z" fill="#45423e"/><path d="M42 181V151Q42 117 89 117Q138 117 139 151V181" fill="'+p.color+'"/><path d="M79 105V124Q90 137 101 124V105" fill="#e5b597"/><ellipse cx="90" cy="76" rx="34" ry="40" fill="#f2c8a8"/><path d="M55 68Q54 31 91 31Q126 31 127 63Q105 61 90 45Q77 65 55 68" fill="#45423e"/><path d="M73 78h2m29 0h2" stroke="#45423e" stroke-width="4" stroke-linecap="round"/><path d="M84 94q7 5 13-1" fill="none" stroke="#ae715b" stroke-width="2.5" stroke-linecap="round"/><circle cx="66" cy="88" r="5" fill="#e9ac96"/><circle cx="114" cy="88" r="5" fill="#e9ac96"/>'+(p.prop==='tools'?'<g fill="none" stroke="#334553" stroke-width="2.5"><rect x="61" y="69" width="23" height="17" rx="5"/><rect x="96" y="69" width="23" height="17" rx="5"/><path d="M84 76h12"/></g><rect x="99" y="147" width="55" height="31" rx="7" fill="#b38962"/><path d="M113 149v-9h24v9m-14 0v28" fill="none" stroke="#725941" stroke-width="4"/>':p.prop==='laptop'?'<rect x="53" y="142" width="82" height="39" rx="5" fill="#ccd8d6" stroke="#6d8b83" stroke-width="2"/><circle cx="94" cy="160" r="5" fill="#f9fbf0"/>':'<path d="M72 128l18 14 18-14" fill="none" stroke="#f6eedc" stroke-width="3"/>')+'</svg>';}
function badge(p){return p.fiction?'':'<span class="tag">提供的人物資料</span>';}
function profile(p){return '<article class="card"><div class="profilehead">'+avatar(p)+'<div><h3>'+p.name+'</h3><p>'+p.role+'</p>'+badge(p)+'</div></div><p>'+p.duties+'</p><details><summary>查看合作小筆記</summary><dl><dt>溝通偏好</dt><dd>'+p.pref+'</dd>'+(p.expert?'<dt>擅長領域</dt><dd>'+p.expert+'</dd>':'')+'<dt>MBTI · 僅展示資料</dt><dd>'+p.mbti+'</dd>'+(p.id==='DEMO02'?'<dt>資料註記</dt><dd>職責保留提供原文「自費診所系教學培訓顧問」；「系」字用語待確認。</dd>':'')+'</dl></details></article>';}
function login(){ $('#nav').hidden=true;$('#logout').hidden=true; main.innerHTML='<section class="login"><div class="hero"><div><div class="eyebrow">HELLO, TEAM !</div><h1>今天，認識一位<br>一起努力的夥伴。</h1><p>選擇示範帳號，進入你的專屬小學堂。<br>每回合 5 題，練習找到對的人。</p></div>'+avatar(people[0])+'</div><div class="card loginform"><h2>先來報到吧</h2><p class="muted">僅模擬員工帳號對應，不驗證真實身分。<br>示範帳號 demo01–demo05 · 共用密碼 <strong>Learn123!</strong><br>密碼公開且僅在前端比對，不具安全保護。</p><form id="loginForm"><label for="account">示範員工帳號</label><input id="account" placeholder="例如 DEMO01" autocomplete="off" spellcheck="false" autocapitalize="characters" aria-describedby="loginError"><label for="password">示範密碼</label><input id="password" type="password" autocomplete="off" placeholder="Learn123!" aria-describedby="loginError"><div id="loginError" class="error" role="alert"></div><button class="primary" type="submit">進入我的小學堂 →</button></form><div class="demoaccounts">'+people.map(p=>'<button data-account="'+p.id+'">'+p.id+' · '+p.name+'</button>').join('')+'</div><small>點選範例可帶入帳號；同一瀏覽器下次會記住你的示範身分。共用裝置請登出。</small></div></section>';$('#loginForm').onsubmit=e=>{e.preventDefault();const p=people.find(p=>p.id===$('#account').value.trim().toUpperCase());if(!p||$('#password').value!=='Learn123!'){$('#loginError').textContent='請使用 demo01–demo05，示範密碼為 Learn123!（區分大小寫）。';return;}me=p;storage('write',p.id);show('home');};document.querySelectorAll('[data-account]').forEach(b=>b.onclick=()=>{$('#account').value=b.dataset.account;$('#loginError').textContent='';$('#account').focus();});}
function show(next){view=next;$('#nav').hidden=false;$('#logout').hidden=false;$('#nav').innerHTML=[['home','小學堂首頁'],['guess','人物猜猜看'],['mission','任務找幫手'],['directory','認識同事']].map(([v,n])=>'<button data-nav="'+v+'" '+(v===view?'aria-current="page"':'')+'>'+n+'</button>').join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>show(b.dataset.nav));if(view==='home')home();if(view==='directory')directory();if(view==='guess'||view==='mission')startRound(view);}
function home(){main.innerHTML='<section class="hero"><div><div class="eyebrow">A LITTLE CLOSER, EVERY DAY</div><h1>嗨，'+me.name+'！<br>讓合作，從熟悉開始。</h1><p>記得名字，也認識彼此的專長。<br>把「這件事找誰？」變成有把握的第一步。</p><button class="primary" id="quickstart">開始今日 5 題 →</button></div><div class="portraits">'+avatar(people[3])+avatar(people[4])+'</div></section><section class="card me">'+avatar(me)+'<div class="details"><small>我的示範員工名片 · '+me.id+'</small><h3>'+me.name+' <span class="tag">'+me.mbti+'</span></h3><p>'+me.role+' · '+me.pref+'</p>'+badge(me)+'</div><button id="mydetails">查看我的職責</button></section><div class="grid"><article class="card activity"><span class="icon" aria-hidden="true">☺</span><small>01 / 認人也認專長</small><h2>人物猜猜看</h2><p class="muted">系統隨機出一位同事，猜猜對方的工作與合作方式。</p><button data-go="guess">來猜一題 →</button></article><article class="card activity"><span class="icon" aria-hidden="true">⚑</span><small>02 / 把認識變成合作</small><h2>任務找幫手</h2><p class="muted">遇到真實工作情境，練習找對窗口、說清楚需求。</p><button data-go="mission">接受任務 →</button></article><article class="card activity"><span class="icon" aria-hidden="true">⌕</span><small>03 / 隨時查找小幫手</small><h2>認識同事</h2><p class="muted">用名字、職務或負責事項搜尋，打開彼此的合作筆記。</p><button data-go="directory">翻開同事名冊 →</button></article></div>';$('#quickstart').onclick=()=>show('guess');$('#mydetails').onclick=()=>{show('directory');$('#search').value=me.name;renderDirectory(me.name);main.querySelector('details').open=true;};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));}
function directory(){main.innerHTML='<div class="sectionhead"><div><div class="eyebrow">TEAM DIRECTORY</div><h1>認識同事</h1><p class="muted">搜尋是查資料，不會改變遊戲出題對象。</p></div><span class="tag">5 位夥伴</span></div><label class="search"><span aria-hidden="true">⌕</span><span class="sr">搜尋姓名、職務或負責事項</span><input id="search" type="search" placeholder="搜尋姓名、職務或負責事項…"></label><p id="resultCount" class="muted" role="status"></p><div id="results" class="grid directory"></div>';$('#search').oninput=e=>renderDirectory(e.target.value);renderDirectory('');}
function renderDirectory(q){const term=q.trim().toLowerCase();const found=people.filter(p=>[p.name,p.role,p.duties,p.expert,p.pref].join(' ').toLowerCase().includes(term));$('#resultCount').textContent='找到 '+found.length+' 位同事';$('#results').innerHTML=found.length?found.map(profile).join(''):'<div class="card empty"><h2>還找不到這位小幫手</h2><p class="muted">試試「培訓」、「教學」或「電腦」，也可以縮短關鍵字。</p><button id="clearSearch">清除搜尋，查看全部</button></div>';if(!found.length)$('#clearSearch').onclick=()=>{$('#search').value='';renderDirectory('');$('#search').focus();};}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function choose(pool,last){const a=pool.filter(p=>p.id!==last);return a[Math.floor(Math.random()*a.length)];}
const missions=[{id:'DEMO01',q:'診所需要製作同意書，想找熟悉牙科健保知識的同事協助。你會先找誰？',why:'張靖欣的職責包含牙科健保知識了解、診所同意書製作與值班客服。聯繫時記得講重點。'}, {id:'DEMO02',q:'醫美培訓相關需求，想用實務案例討論教學。你會先找哪一位同事？',why:'黃小琪負責醫美培訓，偏好以實務面說明。職責原文為「自費診所系教學培訓顧問」，用語待確認。'}, {id:'DEMO03',q:'想確認請假與加班處理方式，並了解新人教育訓練。哪一位是合適的窗口？',why:'蘇詠哲負責請假／加班處理與新人教育訓練，也負責招募及勞資問題。直接說明需求，理性討論並保持禮貌。'}, {id:'DEMO04',q:'診所需要安裝新電腦、完成接線及安裝後測試。你會找誰一起安排？',why:'陳柏宇負責現場電腦安裝、接線與測試。先提供設備數量、現場照片與可施工時間。'}, {id:'DEMO05',q:'系統操作時反覆出現錯誤，想請人追查 Bug、修正並測試。你會先找誰？',why:'林語安負責軟體系統 Bug 的追查、修正與測試。提供操作步驟、錯誤訊息與發生時間；截圖先遮蔽病患個資。'}];
function startRound(mode){round={mode,n:0,score:0,answered:false};question();}
function question(){round.n++;round.answered=false;let p,q,options,answer,why;if(round.mode==='guess'){p=choose(people.filter(p=>p.id!==me.id),lastPerson);lastPerson=p.id;const collaboration=round.n%2===0;if(collaboration){q='與'+p.name+'討論事情時，哪種方式更符合對方提供的偏好？';options=shuffle([p,...shuffle(people.filter(x=>x.id!==p.id)).slice(0,3)]).map(x=>({id:x.id,text:x.pref}));why=p.name+'提供的溝通偏好是「'+p.pref+'」。這是本人資料／示範設定，不是由 MBTI 推論。';}else{q=p.name+'的職務是什麼？';options=shuffle([p,...shuffle(people.filter(x=>x.id!==p.id)).slice(0,3)]).map(x=>({id:x.id,text:x.role}));why=p.name+'的職務是'+p.role+'，負責'+p.duties+'。';}answer=p.id;}else{const m=choose(missions,lastMission);lastMission=m.id;q=m.q;answer=m.id;why=m.why;options=shuffle(people).map(x=>({id:x.id,text:x.name}));}round.answer=answer;round.why=why;main.innerHTML='<div class="sectionhead"><div><div class="eyebrow">'+(round.mode==='guess'?'MEET YOUR TEAM':'FIND YOUR TEAMMATE')+'</div><h2>'+(round.mode==='guess'?'人物猜猜看':'任務找幫手')+'</h2><p class="muted">'+(round.mode==='guess'?'系統隨機出題，不出自己，也不連續出同一位。':'依工作情境選擇合適窗口。')+'</p></div><div class="score">第 '+round.n+' / 5 題<br><span id="score">答對 '+round.score+' 題</span><div class="progress"><span style="width:'+((round.n-1)*20)+'%"></span></div></div></div><section class="card quiz"><div class="person">'+(p?avatar(p)+'<div><small>這位夥伴是…</small><h2>'+p.name+'</h2>'+badge(p)+'</div>':'<div><div style="font-size:68px" aria-hidden="true">⚑</div><h2>合作任務卡</h2><p>先看需求，再找窗口。</p><span class="tag">情境練習 · 單選</span></div>')+'</div><div><span class="tag">'+(round.mode==='guess'?(round.n%2===0?'合作小筆記':'認識工作'):'工作情境')+'</span><h2 style="margin-top:16px" id="question">'+q+'</h2><div class="options" role="group" aria-labelledby="question">'+options.map((o,i)=>'<button class="option" data-answer="'+o.id+'"><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o.text+'</button>').join('')+'</div><div id="feedback" role="status" aria-live="polite"></div></div></section><p class="muted" style="margin-top:16px;font-size:13px">每回合 5 題 · 答完才會揭曉 · 切換分頁將結束本回合</p>';document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answerQuestion(b));}
function answerQuestion(b){if(round.answered)return;round.answered=true;const correct=b.dataset.answer===round.answer;if(correct)round.score++;document.querySelectorAll('[data-answer]').forEach(x=>{x.disabled=true;if(x.dataset.answer===round.answer)x.classList.add('correct');else if(x===b)x.classList.add('wrong');});$('#score').textContent='答對 '+round.score+' 題';$('#feedback').innerHTML='<div class="feedback"><strong>'+(correct?'✓ 答對了！又更認識一位夥伴。':'再記住一個合作小線索。正確答案已標示。')+'</strong><p>'+round.why+'</p><button class="primary" id="next">'+(round.n===5?'看看本回合成果':'下一題 →')+'</button></div>';$('#next').onclick=()=>round.n===5?finish():question();$('#next').focus({preventScroll:true});}
function finish(){main.innerHTML='<section class="result"><div class="eyebrow">ROUND COMPLETE</div><span style="font-size:52px" aria-hidden="true">✳</span><h1>認識，又多了一點！</h1><h2>本回合答對 '+round.score+' / 5 題</h2><p>分數不是重點，記得下次可以找誰就很棒。<br>想複習？同事名冊裡有完整合作筆記。</p><button class="primary" id="again">再玩一回合</button><button id="review">去認識同事</button></section>';$('#again').onclick=()=>startRound(view);$('#review').onclick=()=>show('directory');}
$('#logout').onclick=()=>{storage('remove');me=null;round=null;lastPerson=null;lastMission=null;login();};const stored=storage('read');me=people.find(p=>p.id===stored)||null;if(me)show('home');else login();
</script></body></html>
