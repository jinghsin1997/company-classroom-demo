function directory(){main.innerHTML='<div class="sectionhead"><div><div class="eyebrow">TEAM DIRECTORY</div><h1>認識同事</h1><p class="muted">搜尋是查資料，不會改變遊戲出題對象。</p></div><span class="tag">5 位夥伴</span></div><label class="search"><span aria-hidden="true">⌕</span><span class="sr">搜尋姓名、職務或負責事項</span><input id="search" type="search" placeholder="搜尋姓名、職務或負責事項…"></label><p id="resultCount" class="muted" role="status"></p><div id="results" class="grid directory"></div>';$('#search').oninput=e=>renderDirectory(e.target.value);renderDirectory('');}
function renderDirectory(q){const term=q.trim().toLowerCase();const found=people.filter(p=>[p.name,p.role,p.duties,p.expert,p.pref,p.intro].join(' ').toLowerCase().includes(term));$('#resultCount').textContent='找到 '+found.length+' 位同事';$('#results').innerHTML=found.length?found.map(profile).join(''):'<div class="card empty"><h2>還找不到這位小幫手</h2><p class="muted">試試「培訓」、「教學」或「電腦」，也可以縮短關鍵字。</p><button id="clearSearch">清除搜尋，查看全部</button></div>';if(!found.length)$('#clearSearch').onclick=()=>{$('#search').value='';renderDirectory('');$('#search').focus();};}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function choose(pool,last){const a=pool.filter(p=>p.id!==last);return a[Math.floor(Math.random()*a.length)];}
const missions=[{id:'DEMO01',q:'診所需要製作同意書，想找熟悉牙科健保知識的同事協助。你會先找誰？',why:'張心心的職責包含牙科健保知識了解、診所同意書製作與值班客服。聯繫時記得講重點。'}, {id:'DEMO02',q:'醫美培訓相關需求，想用實務案例討論教學。你會先找哪一位同事？',why:'黃小琪負責醫美培訓，偏好以實務面說明。職責原文為「自費診所系教學培訓顧問」，用語待確認。'}, {id:'DEMO03',q:'想確認請假與加班處理方式，並了解新人教育訓練。哪一位是合適的窗口？',why:'蘇詠哲負責請假／加班處理與新人教育訓練，也負責招募及勞資問題。直接說明需求，理性討論並保持禮貌。'}, {id:'DEMO04',q:'診所需要安裝新電腦、完成接線及安裝後測試。你會找誰一起安排？',why:'陳柏宇負責現場電腦安裝、接線與測試。先提供設備數量、現場照片與可施工時間。'}, {id:'DEMO05',q:'系統操作時反覆出現錯誤，想請人追查 Bug、修正並測試。你會先找誰？',why:'林語安負責軟體系統 Bug 的追查、修正與測試。提供操作步驟、錯誤訊息與發生時間；截圖先遮蔽病患個資。'}];
function startRound(mode){round={mode,n:0,score:0,answered:false};question();}
function question(){round.n++;round.answered=false;let p,q,options,answer,why;if(round.mode==='guess'){p=choose(people.filter(p=>p.id!==me.id),lastPerson);lastPerson=p.id;const collaboration=round.n%2===0;if(collaboration){q='與'+p.name+'討論事情時，哪種方式更符合對方提供的偏好？';options=shuffle([p,...shuffle(people.filter(x=>x.id!==p.id)).slice(0,3)]).map(x=>({id:x.id,text:x.pref+'（'+x.name+'）'}));why=p.name+'提供的溝通偏好是「'+p.pref+'」。這是提供資料，不是由 MBTI 推論。';}else{q=p.name+'的職務是什麼？';options=shuffle([p,...shuffle(people.filter(x=>x.id!==p.id)).slice(0,3)]).map(x=>({id:x.id,text:x.role+'（'+x.name+'）'}));why=p.name+'的職務是'+p.role+'，負責'+p.duties+'。';}answer=p.id;}else{const m=choose(missions,lastMission);lastMission=m.id;q=m.q;answer=m.id;why=m.why;options=shuffle(missionPeople).map(x=>({id:x.id,text:x.name}));}round.answer=answer;round.why=why;main.innerHTML='<div class="sectionhead"><div><div class="eyebrow">'+(round.mode==='guess'?'MEET YOUR TEAM':'FIND YOUR TEAMMATE')+'</div><h2>'+(round.mode==='guess'?'人物猜猜看':'任務找幫手')+'</h2><p class="muted">'+(round.mode==='guess'?'系統隨機出題，不出自己，也不連續出同一位。':'固定示範題庫：依原始人物設定作答，不使用本機編輯資料。')+'</p></div><div class="score">第 '+round.n+' / 5 題<br><span id="score">答對 '+round.score+' 題</span><div class="progress"><span style="width:'+((round.n-1)*20)+'%"></span></div></div></div><section class="card quiz"><div class="person">'+(p?avatar(p)+'<div><small>這位夥伴是…</small><h2>'+esc(p.name)+'</h2>'+badge(p)+'</div>':'<div><div style="font-size:68px" aria-hidden="true">⚑</div><h2>合作任務卡</h2><p>先看需求，再找窗口。</p><span class="tag">情境練習 · 單選</span></div>')+'</div><div><span class="tag">'+(round.mode==='guess'?(round.n%2===0?'合作小筆記':'認識工作'):'工作情境')+'</span><h2 style="margin-top:16px" id="question">'+esc(q)+'</h2><div class="options" role="group" aria-labelledby="question">'+options.map((o,i)=>'<button class="option" data-answer="'+o.id+'"><span class="letter">'+String.fromCharCode(65+i)+'</span>'+esc(o.text)+'</button>').join('')+'</div><div id="feedback" role="status" aria-live="polite"></div></div></section><p class="muted" style="margin-top:16px;font-size:13px">每回合 5 題 · 答完才會揭曉 · 切換分頁將結束本回合</p>';document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answerQuestion(b));}
function answerQuestion(b){if(round.answered)return;round.answered=true;const correct=b.dataset.answer===round.answer;if(correct)round.score++;document.querySelectorAll('[data-answer]').forEach(x=>{x.disabled=true;if(x.dataset.answer===round.answer)x.classList.add('correct');else if(x===b)x.classList.add('wrong');});$('#score').textContent='答對 '+round.score+' 題';$('#feedback').innerHTML='<div class="feedback"><strong>'+(correct?'✓ 答對了！又更認識一位夥伴。':'再記住一個合作小線索。正確答案已標示。')+'</strong><p>'+esc(round.why)+'</p><button class="primary" id="next">'+(round.n===5?'看看本回合成果':'下一題 →')+'</button></div>';$('#next').onclick=()=>round.n===5?finish():question();$('#next').focus({preventScroll:true});}
function finish(){main.innerHTML='<section class="result"><div class="eyebrow">ROUND COMPLETE</div><div class="result-art">'+avatar(me)+'</div><h1>認識，又多了一點！</h1><h2>本回合答對 '+round.score+' / 5 題</h2><p>分數不是重點，記得下次可以找誰就很棒。<br>想複習？同事名冊裡有完整合作筆記。</p><button class="primary" id="again">再玩一回合</button><button id="review">去認識同事</button></section>';$('#again').onclick=()=>startRound(view);$('#review').onclick=()=>show('directory');}

function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const missionPeople=people.map(p=>({...p}));
const PROFILE_PREFIX='company-classroom-illustrated-profile-v2:';
const profileFields=[['name','顯示姓名',40,true],['role','職務',80,true],['duties','負責事項',600,true],['expert','擅長領域',300,false],['pref','合作／溝通偏好',400,true],['mbti','MBTI（選填，不推論個性）',20,false],['intro','自我介紹',800,false]];
function validProfile(data){return data&&typeof data==='object'&&profileFields.every(([k,label,max,required])=>typeof data[k]==='string'&&data[k].length<=max&&(!required||data[k].trim().length>0));}

function boundedTextPages(value,max=84){const chars=Array.from(String(value));const pages=[];let page='',lines=0;for(const c of chars){if(Array.from(page).length>=max||(c==='\n'&&lines>=4)){pages.push(page);page='';lines=0;}page+=c;if(c==='\n')lines++;}if(page||!pages.length)pages.push(page);return pages;}

let directoryPage=0,profilePage=0,adminPageIndex=0,reflectionPage=0,reflectionAnswers=Array(16).fill('skip');
const fullDirectory=directory;directory=function(){fullDirectory();$('#results').classList.add('paged-directory');const search=$('#search');search.oninput=e=>{directoryPage=0;renderDirectory(e.target.value);};renderDirectory(search.value||'');};
renderDirectory=function(q){const term=q.trim().toLowerCase(),found=people.filter(p=>[p.name,p.role,p.duties,p.expert,p.pref,p.intro].join(' ').toLowerCase().includes(term));directoryPage=Math.min(directoryPage,Math.max(0,found.length-1));$('#resultCount').textContent='找到 '+found.length+' 位 · '+(found.length?directoryPage+1:0)+' / '+found.length;$('#results').innerHTML=found.length?profile(found[directoryPage])+'<div class="pager"><button id="prevPerson" '+(directoryPage===0?'disabled':'')+'>上一位</button><button id="nextPerson" '+(directoryPage===found.length-1?'disabled':'')+'>下一位</button></div>':'<p>查無資料，請更換關鍵字。</p>';if(found.length){$('#prevPerson').onclick=()=>{directoryPage--;renderDirectory(q);};$('#nextPerson').onclick=()=>{directoryPage++;renderDirectory(q);};}};
home=function(){const c=counts();main.innerHTML='<section class="card game-home"><div class="home-copy"><div class="eyebrow">嗨，'+esc(me.name)+'</div><h1>每天三題，<br>認識一位夥伴。</h1><h2>已解鎖 '+c.current+' / '+c.total+'</h2><p>累計 '+c.lifetime+' 枚徽章 · 更新資料後待複習，徽章保留。</p><button class="primary" id="startJourney">隨機認識下一位 →</button><p class="muted">不出自己，不排名，不用於評核。</p></div><img class="home-art" src="'+$('#teamArt').src+'" alt="陽光辦公室夥伴插畫"></section>';$('#startJourney').onclick=()=>{challenge=null;show('guess');};};
function wizard(formId,labels,groups){const form=$(formId);const all=[...form.querySelectorAll(':scope > label,:scope > input,:scope > textarea,:scope > small')];const actions=form.querySelector('.actions');const pager=document.createElement('div');pager.className='pager wizard-pager';pager.innerHTML='<button type="button" id="wizardPrev">上一步</button><span id="wizardCount"></span><button type="button" id="wizardNext">下一步</button>';form.append(pager);let step=0;function update(){all.forEach(el=>{const id=el.htmlFor||el.id;el.hidden=!groups[step].some(key=>id===key||id==='limit-'+key.replace('field-',''));});if(actions)actions.hidden=step!==groups.length-1;const submit=form.querySelector('button[type="submit"],button:not([type])');if(submit&&!actions)submit.hidden=step!==groups.length-1;$('#wizardPrev').disabled=step===0;$('#wizardNext').hidden=step===groups.length-1;$('#wizardCount').textContent=(step+1)+' / '+groups.length+' · '+labels[step];}$('#wizardPrev').onclick=()=>{step--;update();};$('#wizardNext').onclick=()=>{const inputs=groups[step].map(id=>$('#'+id)).filter(Boolean);for(const el of inputs){if(el.required&&!el.value.trim()){el.focus();if(el.reportValidity)el.reportValidity();return;}}step++;update();};update();}
const fullEditProfile=editProfile;editProfile=function(message=''){fullEditProfile(message);if(!me||me.admin)return;wizard('#profileForm',['帳號','姓名','職務','負責事項','擅長領域','MBTI','合作偏好','自我介紹與儲存'],[['profileAccount'],['field-name'],['field-role'],['field-duties'],['field-expert'],['field-mbti'],['field-pref'],['field-intro']]);};
const fullAdminPage=adminPage;adminPage=function(){fullAdminPage();if(!me?.admin)return;wizard('#adminForm',['帳號','姓名','職務','示範密碼'],[['newId'],['newName'],['newRole'],['newPassword']]);};
reflection=function(){reflectionPage=0;reflectionAnswers=Array(16).fill('skip');reflectionScene();};
function reflectionScene(){const q=reflectItems[reflectionPage];main.innerHTML='<section class="card reflection-scene"><div class="eyebrow">自願偏好探索 · '+(reflectionPage+1)+' / 16</div><h2>'+q[1]+'</h2><p class="muted">原創 MBTI 概念啟發，非官方測驗／診斷，不用於聘用評核。可跳過，結果不自動儲存。</p><div class="options">'+[['a',q[2]],['b',q[3]],['skip','不確定／跳過']].map(([v,t])=>'<button data-reflect="'+v+'" aria-pressed="'+(reflectionAnswers[reflectionPage]===v)+'">'+t+'</button>').join('')+'</div><div class="pager"><button id="reflectPrev" '+(reflectionPage===0?'disabled':'')+'>上一題</button><button class="primary" id="reflectNext">'+(reflectionPage===15?'查看暫時結果':'下一題')+'</button><button id="reflectExit">離開，不儲存</button></div></section>';document.querySelectorAll('[data-reflect]').forEach(b=>b.onclick=()=>{reflectionAnswers[reflectionPage]=b.dataset.reflect;reflectionScene();});$('#reflectPrev').onclick=()=>{reflectionPage--;reflectionScene();};$('#reflectNext').onclick=()=>{if(reflectionPage<15){reflectionPage++;reflectionScene();}else renderReflectionResult(reflectionAnswers);};$('#reflectExit').onclick=()=>show('home');}
// Re-render after installing scene adapters.
if(me)show(me.admin?'admin':'home');else login();

let noteIndex=0;
profile=function(p){return '<article class="card"><p class="collect-state">'+(p.id===me.id?'我的名片':achievement(p))+'</p><div class="profilehead">'+avatar(p)+'<div><h3>'+esc(p.name)+'</h3><p>'+esc(p.role)+'</p></div></div><button id="openNotes">合作筆記（分頁查看）</button></article>';};
const pagedRender=renderDirectory;renderDirectory=function(q){pagedRender(q);const term=q.trim().toLowerCase(),found=people.filter(p=>[p.name,p.role,p.duties,p.expert,p.pref,p.intro].join(' ').toLowerCase().includes(term));if(found.length)$('#openNotes').onclick=()=>{noteIndex=0;notesScene(found[directoryPage]);};};
function notesScene(p){const sections=[['負責事項',p.duties],['合作偏好',p.pref],['擅長領域',p.expert||'尚未填寫'],['自我介紹',p.intro||'尚未填寫'],['MBTI（自填資料，不推論個性）',p.mbti||'尚未填寫']];const notes=sections.flatMap(([title,value])=>boundedTextPages(value).map((part,i)=>[title+(i?'（續）':''),part]));const [title,value]=notes[noteIndex];main.innerHTML='<section class="card profileform"><div class="eyebrow">'+esc(p.name)+' · 筆記 '+(noteIndex+1)+' / '+notes.length+'</div><h2>'+title+'</h2><p class="note-body">'+esc(value)+'</p><div class="pager"><button id="notePrev" '+(noteIndex===0?'disabled':'')+'>上一頁</button><button id="noteNext" '+(noteIndex===notes.length-1?'disabled':'')+'>下一頁</button><button id="noteBack">返回名冊</button></div></section>';$('#notePrev').onclick=()=>{noteIndex--;notesScene(p);};$('#noteNext').onclick=()=>{noteIndex++;notesScene(p);};$('#noteBack').onclick=()=>show('directory');}
const conciseReflection=renderReflectionResult;renderReflectionResult=function(answers){conciseReflection(answers);const box=main.querySelector('.profileform');if(box)box.classList.add('reflection-result');};
if(me)show(me.admin?'admin':'home');else login();

function textDetailScene(text,back,page=0){const pages=boundedTextPages(text);main.innerHTML='<section class="card profileform"><div class="eyebrow">完整文字 · '+(page+1)+' / '+pages.length+'</div><p class="note-body">'+esc(pages[page])+'</p><div class="pager"><button id="detailPrev" '+(!page?'disabled':'')+'>上一頁</button><button id="detailNext" '+(page===pages.length-1?'disabled':'')+'>下一頁</button><button id="detailBack">返回題目</button></div></section>';$('#detailPrev').onclick=()=>textDetailScene(text,back,page-1);$('#detailNext').onclick=()=>textDetailScene(text,back,page+1);$('#detailBack').onclick=back;}
function boundOptions(back){document.querySelectorAll('.option').forEach(button=>{const full=button.textContent;if(Array.from(full).length<=42)return;button.textContent=Array.from(full).slice(0,38).join('')+'…';const detail=document.createElement('button');detail.type='button';detail.className='text-detail-button';detail.textContent='查看此選項全文';detail.onclick=()=>textDetailScene(full,back);button.after(detail);});}
const unboundedChallenge=renderChallenge;renderChallenge=function(){unboundedChallenge();boundOptions(renderChallenge);};
const unboundedQuestion=question;question=function(){unboundedQuestion();boundOptions(()=>{round.n--;question();});};
// Long correct-answer feedback is available through the same bounded detail scene.
const feedbackObserver=typeof MutationObserver==='undefined'?null:new MutationObserver(()=>{const host=$('#challengeFeedback');if(!host||host.dataset.bounded===host.innerHTML)return;const p=host.querySelector('p');if(p&&Array.from(p.textContent).length>84){const full=p.textContent;p.textContent=Array.from(full).slice(0,60).join('')+'…';const btn=document.createElement('button');btn.className='text-detail-button';btn.textContent='完整合作筆記';btn.onclick=()=>{const saved=main.innerHTML;const step=challenge.step;textDetailScene(full,()=>{challenge.step=step;renderChallenge();});};p.after(btn);}host.dataset.bounded=host.innerHTML;});
if(feedbackObserver)feedbackObserver.observe(main,{childList:true,subtree:true});

// Overview pages contain six coworkers; details retain complete paginated notes.
let overviewQuery='',overviewPage=0;
directory=function(){main.innerHTML='<section class="overview-heading"><h1>同事總覽</h1><label class="search"><span class="sr">搜尋姓名、職務或負責事項</span><input id="search" type="search" placeholder="搜尋姓名、職務或負責事項…"></label><p id="resultCount" role="status"></p></section><div id="results" class="overview-grid"></div><div id="overviewPager" class="pager"></div>';$('#search').value=overviewQuery;$('#search').oninput=e=>{overviewPage=0;renderDirectory(e.target.value);};renderDirectory(overviewQuery);};
renderDirectory=function(q){overviewQuery=q;const term=q.trim().toLowerCase(),found=people.filter(p=>[p.name,p.role,p.duties,p.expert,p.pref,p.intro].join(' ').toLowerCase().includes(term));overviewPage=Math.min(overviewPage,Math.max(0,Math.ceil(found.length/6)-1));const shown=found.slice(overviewPage*6,overviewPage*6+6);$('#resultCount').textContent='找到 '+found.length+' 位夥伴';$('#results').innerHTML=shown.length?shown.map(p=>'<button class="overview-card" data-person="'+p.id+'" aria-label="查看 '+esc(p.name)+' 的資料">'+avatar(p)+'<span class="overview-name">'+esc(p.name)+'</span><span class="overview-role">'+esc(p.role)+'</span><span class="overview-state">'+(p.id===me.id?'我的名片':achievement(p))+'</span></button>').join(''):'<p class="overview-empty">查無資料，請更換關鍵字。</p>';$('#overviewPager').hidden=found.length<=6;$('#overviewPager').innerHTML=found.length>6?'<button id="overviewPrev" '+(!overviewPage?'disabled':'')+'>上一組</button><span>'+(overviewPage+1)+' / '+Math.ceil(found.length/6)+'</span><button id="overviewNext" '+((overviewPage+1)*6>=found.length?'disabled':'')+'>下一組</button>':'';if(found.length>6){$('#overviewPrev').onclick=()=>{overviewPage--;renderDirectory(overviewQuery);};$('#overviewNext').onclick=()=>{overviewPage++;renderDirectory(overviewQuery);};}document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{noteIndex=0;notesScene(people.find(p=>p.id===b.dataset.person));});};
const overviewNotes=notesScene;notesScene=function(p){overviewNotes(p);$('#noteBack').textContent='返回總覽';$('#noteBack').onclick=()=>show('directory');};
if(me&&view==='directory')directory();
</script></body></html>
